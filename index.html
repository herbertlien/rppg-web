<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rPPG 雛形</title>
<style>
  :root{--bg:#faf8f5;--fg:#222;--mut:#777;--ac:#2f7d5b;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--ac:#5cc79a;--card:#222}}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Noto Sans TC",sans-serif;max-width:480px;margin:auto}
  h1{font-size:20px;margin:8px 0}
  .box{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #ov{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
  button{width:100%;padding:14px;margin:10px 0 0;font-size:17px;border:0;border-radius:10px;background:var(--ac);color:#fff}
  button:disabled{opacity:.4}
  [hidden]{display:none!important}
  button.ghost{background:none;color:var(--mut);border:1px solid var(--mut);font-size:14px;padding:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:3px 0}
  label{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
  .card{background:var(--card);border-radius:10px;padding:12px;margin-top:10px}
  .big{font-size:40px;font-weight:700}
  .mut{color:var(--mut);font-size:14px}
  pre{white-space:pre-wrap;font-size:12px;margin:0}
</style>
</head>
<body>
<h1>rPPG 量測雛形</h1>
<p class="mut">請在明亮、均勻的光線下，臉對著前鏡頭，手機放穩，30 秒內不要說話或大幅移動。</p>
<div class="box"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
<button id="go">開始（會要求使用前鏡頭）</button>
<div class="card">
  <div id="st" class="mut">尚未開始</div>
  <div class="big" id="hr">--</div>
  <div class="mut" id="q"></div>
</div>
<button id="csv" disabled>匯出 CSV（對照 Apple Watch 用）</button>
<div class="card" id="consent" hidden>
  <b>儲存量測紀錄前，請先閱讀並同意</b>
  <p class="mut">（測試版說明，正式上線前會由專業人士審閱後更新）<br>
  我們只會儲存每次量測的「時間、心率、訊號品質」等數字，用來顯示你的每週趨勢。不會儲存你的臉部影像，影像只在你的手機上運算。這些數字不是醫療診斷。你隨時可以在本頁刪除自己的全部資料。</p>
  <label><input type="checkbox" id="agree"> 我已閱讀並同意以上說明</label>
  <button id="consentBtn" disabled>同意並開始儲存</button>
</div>
<div class="card" id="hist" hidden>
  <b>我的紀錄</b>
  <div class="mut" id="weekly"></div>
  <table id="histTable"></table>
  <button id="del" class="ghost">刪除我的所有資料</button>
</div>
<div class="card"><div class="mut">環境資訊（回報問題時請截圖）</div><pre id="env"></pre><pre id="env3"></pre><pre id="env2"></pre></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
// rPPG 訊號處理：POS 演算法（Wang et al., 2017, IEEE TBME）依論文公式自行實作，無第三方程式碼。
const FS = 30; // 重新取樣頻率（Hz）

// 把不等間隔的取樣（t 單位：秒）線性內插成固定 FS
function resample(t, ch, fs = FS) {
  const n = Math.floor((t[t.length - 1] - t[0]) * fs);
  const out = [new Float64Array(n), new Float64Array(n), new Float64Array(n)];
  let j = 0;
  for (let i = 0; i < n; i++) {
    const x = t[0] + i / fs;
    while (j < t.length - 2 && t[j + 1] < x) j++;
    const a = (x - t[j]) / (t[j + 1] - t[j] || 1);
    for (let c = 0; c < 3; c++) out[c][i] = ch[c][j] * (1 - a) + ch[c][j + 1] * a;
  }
  return out;
}

const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const std = a => { const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); };

// POS：滑動視窗 1.6 秒，重疊相加
function pos(rgb, fs = FS) {
  const n = rgb[0].length, L = Math.round(1.6 * fs);
  const H = new Float64Array(n);
  for (let s = 0; s + L <= n; s++) {
    const seg = rgb.map(c => Array.from(c.subarray(s, s + L)));
    const cn = seg.map(c => { const m = mean(c) || 1; return c.map(v => v / m); });
    const s1 = cn[1].map((g, i) => g - cn[2][i]);
    const s2 = cn[1].map((g, i) => -2 * cn[0][i] + g + cn[2][i]);
    const a = std(s1) / (std(s2) || 1);
    const h = s1.map((v, i) => v + a * s2[i]);
    const m = mean(h);
    for (let i = 0; i < L; i++) H[s + i] += h[i] - m;
  }
  return H;
}

// 去除緩慢趨勢（移動平均相減，約 1 秒）
function detrend(x, fs = FS) {
  const w = Math.round(fs), out = new Float64Array(x.length);
  for (let i = 0; i < x.length; i++) {
    let s = 0, c = 0;
    for (let k = Math.max(0, i - w); k <= Math.min(x.length - 1, i + w); k++) { s += x[k]; c++; }
    out[i] = x[i] - s / c;
  }
  return out;
}

// 漢寧視窗 + 補零 DFT，只掃 0.7–3.5 Hz（42–210 bpm）；回傳心率與訊號品質
function estimateHR(x, fs = FS) {
  const n = x.length, N = 4096;
  const w = x.map((v, i) => v * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1))));
  const f0 = 0.7, f1 = 3.5, df = fs / N;
  const k0 = Math.ceil(f0 / df), k1 = Math.floor(f1 / df);
  const P = new Float64Array(k1 + 1);
  for (let k = k0; k <= k1; k++) {
    let re = 0, im = 0; const ph = 2 * Math.PI * k / N;
    for (let i = 0; i < n; i++) { re += w[i] * Math.cos(ph * i); im -= w[i] * Math.sin(ph * i); }
    P[k] = re * re + im * im;
  }
  let kp = k0; for (let k = k0; k <= k1; k++) if (P[k] > P[kp]) kp = k;
  let total = 0, sig = 0;
  for (let k = k0; k <= k1; k++) {
    total += P[k];
    const f = k * df, fp = kp * df;
    if (Math.abs(f - fp) < 0.12 || Math.abs(f - 2 * fp) < 0.12) sig += P[k];
  }
  const snr = sig / ((total - sig) || 1e-12);
  return { bpm: kp * df * 60, snr, quality: sig / (total || 1) };
}

function analyze(t, ch, fs = FS) {
  const r = resample(t, ch, fs);
  return estimateHR(detrend(pos(r, fs), fs), fs);
}

import { FilesetResolver, FaceLandmarker } from './vendor/vision_bundle.mjs';

const $ = id => document.getElementById(id);
const DUR = 30;
// 額頭與雙頰的臉部特徵點編號（MediaPipe 468 點網格）
const REGIONS = [
  [10,67,69,104,108,151,337,299,297,338],
  [50,101,118,117,123,187],
  [280,330,347,346,352,411],
];
$('env').textContent = 'UA: ' + navigator.userAgent + '\nLINE 內建: ' + /Line\//i.test(navigator.userAgent) +
  '\ngetUserMedia: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);


let landmarker, rows = [], lastResult = null, onScanDone = async () => {}, stageText = '', camInfo = '';
const v = $('v'), ov = $('ov'), octx = ov.getContext('2d');
const grab = document.createElement('canvas'); const gctx = grab.getContext('2d', { willReadFrequently: true });

const BASE = './vendor';
const MODEL = './vendor/face_landmarker.task';
const renderDyn = () => { $('env3').textContent = '階段: ' + stageText + (camInfo ? '\n鏡頭: ' + camInfo : ''); };
const stage = s => { $('st').textContent = s; stageText = s; renderDyn(); };
const withTimeout = (p, ms, name) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(name + ' 逾時（' + ms / 1000 + ' 秒）')), ms))]);

async function fetchModel() {
  const res = await fetch(MODEL);
  if (!res.ok) throw new Error('模型下載失敗 HTTP ' + res.status);
  const total = +res.headers.get('content-length') || 3758596, reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    chunks.push(value); got += value.length; stage('下載模型 ' + Math.round(got / total * 100) + '%');
  }
  const buf = new Uint8Array(got); let o = 0; for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf;
}

async function init() {
  stage('1/3 下載臉部偵測模型…');
  const model = await withTimeout(fetchModel(), 60000, '下載模型');
  stage('2/3 載入 WASM 執行環境…');
  const fs = await withTimeout(FilesetResolver.forVisionTasks(BASE + '/wasm'), 30000, '載入 WASM');
  stage('3/3 建立偵測器…');
  const opts = d => ({ baseOptions: { modelAssetBuffer: model, delegate: d }, runningMode: 'VIDEO', numFaces: 1 });
  try { landmarker = await withTimeout(FaceLandmarker.createFromOptions(fs, opts('CPU')), 30000, '建立偵測器'); }
  catch (e) { stage('CPU 失敗（' + e.message + '），改試 GPU…'); landmarker = await withTimeout(FaceLandmarker.createFromOptions(fs, opts('GPU')), 30000, '建立偵測器(GPU)'); }
}

function roiMean(lm, idx) {
  const W = grab.width, H = grab.height;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const i of idx) { const p = lm[i]; x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const x = Math.max(0, Math.floor(x0 * W)), y = Math.max(0, Math.floor(y0 * H));
  const w = Math.min(W - x, Math.ceil((x1 - x0) * W)), h = Math.min(H - y, Math.ceil((y1 - y0) * H));
  if (w < 4 || h < 4) return null;
  const d = gctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  return { m: [r / n, g / n, b / n], box: [x, y, w, h] };
}

function show(r, final) {
  $('hr').textContent = Math.round(r.bpm) + ' bpm';
  const lvl = r.quality > .55 ? '良好' : r.quality > .35 ? '普通，建議重測' : '不佳，請重測';
  $('q').textContent = '訊號品質：' + lvl + '（' + r.quality.toFixed(2) + '）' + (final ? '' : ' ・即時估計');
}

function series(from = 0) {
  const s = rows.slice(from);
  return { t: s.map(r => r.t), ch: [0, 1, 2].map(c => s.map(r => r.rgb[c])) };
}

async function run() {
  $('go').disabled = true; $('csv').disabled = true; rows = []; lastResult = null; $('hr').textContent = '--';
  try {
    stage('等待模型載入完成…'); await ready; stage('模型就緒，啟動鏡頭…');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
    v.srcObject = stream; await v.play();
    grab.width = v.videoWidth; grab.height = v.videoHeight; ov.width = v.videoWidth; ov.height = v.videoHeight;
    const trk = stream.getVideoTracks()[0]; const set = trk.getSettings();
    camInfo = set.width + 'x' + set.height + ' @' + (set.frameRate || '?') + 'fps'; renderDyn();
    let t0 = null, lastShown = 0, noFace = 0;
    await new Promise(done => {
      const tick = (now) => {
        gctx.drawImage(v, 0, 0, grab.width, grab.height);
        const res = landmarker.detectForVideo(v, now);
        octx.clearRect(0, 0, ov.width, ov.height);
        if (res.faceLandmarks.length) {
          const lm = res.faceLandmarks[0]; const parts = REGIONS.map(r => roiMean(lm, r));
          if (parts.every(Boolean)) {
            if (t0 === null) t0 = now;
            const rgb = [0, 1, 2].map(c => parts.reduce((s, p) => s + p.m[c], 0) / parts.length);
            rows.push({ t: (now - t0) / 1000, rgb });
            octx.strokeStyle = '#5cc79a'; octx.lineWidth = 3;
            parts.forEach(p => octx.strokeRect(...p.box));
          }
          noFace = 0;
        } else noFace++;
        const el = t0 === null ? 0 : (now - t0) / 1000;
        $('st').textContent = noFace > 15 ? '找不到臉，請對準鏡頭' : '量測中… ' + Math.min(DUR, Math.round(el)) + ' / ' + DUR + ' 秒';
        if (el > 12 && el - lastShown > 2 && rows.length > 200) { lastShown = el; const s = series(Math.max(0, rows.findIndex(r => r.t > el - 15))); show(analyze(s.t, s.ch), false); }
        if (el >= DUR) return done();
        v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
      };
      v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    });
    stream.getTracks().forEach(t => t.stop()); octx.clearRect(0, 0, ov.width, ov.height);
    if (rows.length < 300) { $('st').textContent = '有效畫面太少（' + rows.length + ' 幀），請重測'; }
    else {
      const s = series(); lastResult = analyze(s.t, s.ch); show(lastResult, true);
      const fps = rows.length / rows[rows.length - 1].t;
      $('st').textContent = '完成（' + rows.length + ' 幀，平均 ' + fps.toFixed(1) + ' fps）';
      $('csv').disabled = false;
      onScanDone();
    }
  } catch (e) { $('st').textContent = '失敗：' + e.name + ' ' + e.message; }
  $('go').disabled = false; $('go').textContent = '重新量測';
}

// 一開頁就先載入模型，使用者讀說明的時間就不浪費
const ready = init().catch(e => { stage('模型載入失敗：' + e.message + '（請重新整理）'); throw e; });
ready.then(() => { stage('模型已就緒，可以開始'); }).catch(() => {});
$('go').onclick = run;
$('csv').onclick = () => {
  const head = '# bpm=' + (lastResult ? lastResult.bpm.toFixed(1) : '') + ',quality=' + (lastResult ? lastResult.quality.toFixed(2) : '') + ',ua=' + JSON.stringify(navigator.userAgent) + '\nt_sec,R,G,B\n';
  const body = rows.map(r => r.t.toFixed(4) + ',' + r.rgb.map(x => x.toFixed(3)).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([head + body], { type: 'text/csv' }));
  a.download = 'rppg_' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv'; a.click();
};

// ===== LINE 登入與雲端儲存（只送「時間、心率、品質」等數字，不送影像）=====
const LIFF_ID = '2012160129-CwL40nTW';
const API = 'https://gokvjcwjkhhnmckbbyxl.supabase.co/functions/v1/scan';
const ALGO = 'pos-1';
let cloud = { on: false, consented: false };
const liffOut = s => { $('env2').textContent = 'LIFF: ' + s; };

async function api(action, extra = {}) {
  const idToken = liff.getIDToken();
  if (!idToken) return { status: 0, body: { error: 'no_token' } };
  const res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, idToken, ...extra }) });
  let body = {}; try { body = await res.json(); } catch {}
  return { status: res.status, body };
}

const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };

function renderHist(scans) {
  const ok = scans.filter(s => s.quality >= 0.35), now = Date.now(), wk = 7 * 864e5;
  const w = [3, 2, 1, 0].map(i => median(ok.filter(s => { const d = now - new Date(s.scanned_at).getTime(); return d >= i * wk && d < (i + 1) * wk; }).map(s => s.bpm)));
  $('weekly').textContent = '每週心率中位數（近 4 週，舊到新，只計品質達標的量測）：' + w.map(v => v === null ? '—' : Math.round(v)).join(' → ');
  $('histTable').innerHTML = '<tr><th>時間</th><th>心率</th><th>品質</th></tr>' + scans.slice(0, 10).map(s =>
    '<tr><td>' + new Date(s.scanned_at).toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) +
    '</td><td>' + Math.round(s.bpm) + ' bpm</td><td>' + s.quality.toFixed(2) + '</td></tr>').join('');
}

async function refresh() {
  const r = await api('list');
  if (r.status === 401) { liffOut('登入已過期，請關閉後重新開啟'); return; }
  if (r.status !== 200) { liffOut('讀取紀錄失敗（' + r.status + '）'); return; }
  cloud.consented = r.body.consented;
  $('consent').hidden = cloud.consented;
  $('hist').hidden = !cloud.consented;
  if (cloud.consented) renderHist(r.body.scans);
}

onScanDone = async () => {
  if (!cloud.on) return;
  if (!cloud.consented) { $('consent').hidden = false; return; }
  const dev = /iPhone|iPad/.test(navigator.userAgent) ? 'ios' : /Android/.test(navigator.userAgent) ? 'android' : 'other';
  const r = await api('save', { bpm: lastResult.bpm, quality: lastResult.quality, validFrames: rows.length, algoVersion: ALGO, device: dev });
  const msg = r.status === 200 ? '已儲存' : r.status === 429 ? '量測太頻繁，未儲存' : r.status === 401 ? '登入已過期，未儲存，請關閉後重開' : '儲存失敗（' + r.status + '）';
  $('st').textContent += '；' + msg;
  if (r.status === 200) refresh();
};

$('agree').onchange = () => { $('consentBtn').disabled = !$('agree').checked; };
$('consentBtn').onclick = async () => {
  $('consentBtn').disabled = true;
  const r = await api('consent');
  if (r.status === 200) { await refresh(); $('st').textContent = '已同意，之後的量測會自動儲存'; } else { $('st').textContent = '同意失敗（' + r.status + '）'; $('consentBtn').disabled = false; }
};
$('del').onclick = async () => {
  if (!confirm('確定刪除你在這裡的所有量測紀錄與同意紀錄？此動作無法復原。')) return;
  const r = await api('delete');
  if (r.status === 200) { cloud.consented = false; $('hist').hidden = true; $('st').textContent = '已刪除你的所有資料'; } else { $('st').textContent = '刪除失敗（' + r.status + '）'; }
};

(async () => {
  try {
    if (!window.liff) throw new Error('LIFF SDK 未載入');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liffOut('未登入（非 LINE 內開啟時，量測結果只顯示、不儲存）'); return; }
    cloud.on = true;
    liffOut('已登入 LINE，量測結果可儲存');
    await refresh();
  } catch (e) { liffOut('失敗 ' + e.message); }
})();
</script>
</body>
</html>
