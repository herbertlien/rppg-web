<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Deerly 配方審核</title>
<link rel="stylesheet" href="../engine/style.css?v=202610231240">
<style>
  .card h2{font-size:17px;margin:0 0 6px}
  .pick{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;margin:6px 0}
  .pick label{display:flex;gap:4px;align-items:center}
  textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;margin-top:6px}
  .row{display:flex;gap:8px}
  .row button{flex:1}
  details{margin-top:6px;font-size:14px}
</style>
</head>
<body>
<h1>Deerly 配方審核</h1>
<p id="status" class="mut">載入中…</p>
<div id="list"></div>
<div class="card" id="chatmenu" hidden>
  <b>LINE 聊天室問卷選單</b>
  <p class="mut">題目或選單圖更新後，按這顆重新建立聊天室的選單（約需一分鐘）。</p>
  <button id="setupMenus" class="go ghost">建立／更新聊天室選單</button>
  <div id="setupMsg" class="warn" style="white-space:pre-wrap"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
// 版本檢查：LINE 會快取舊網頁，發現有新版就帶版本號重新載入一次
const V = '202610231240';
{
  const u = new URL(location.href);
  try {
    const { v } = await fetch(`../engine/version.json`, { cache: 'no-store' }).then(r => r.json());
    if (v !== V && u.searchParams.get('_v') !== v) { u.searchParams.set('_v', v); location.replace(u); await new Promise(() => {}); }
  } catch { /* 讀不到版本檔就用目前的版本 */ }
}
const { el } = await import(`../engine/survey.js?v=${V}`);
const { login, call } = await import(`../engine/api.js?v=${V}`);

const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };
const questions = await fetch(`../engine/data/questions.json?v=${V}`).then(r => r.json());

try {
  if (await login()) await refresh();
} catch (e) {
  status('無法登入 LINE：' + e.message);
}

async function refresh() {
  const who = await call('whoami');
  if (who.status !== 200) return status('登入失敗（' + who.status + '）');
  if (!who.body.admin) {
    status('');
    const c = el('div', 'card');
    c.append(el('div', '', '這個 LINE 帳號還不是審核者。請把下面這串 ID 設定到 Supabase 的 ADMIN_LINE_SUBS：'), el('pre', '', who.body.sub));
    $('list').replaceChildren(c);
    return;
  }
  $('chatmenu').hidden = false;
  $('setupMenus').onclick = async () => {
    $('setupMenus').disabled = true;
    $('setupMsg').textContent = '建立中，請稍候…';
    try {
      const res = await fetch('https://gokvjcwjkhhnmckbbyxl.supabase.co/functions/v1/linebot', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'setup', idToken: liff.getIDToken() }),
      });
      const b = await res.json().catch(() => ({}));
      $('setupMsg').textContent = res.ok ? `完成，已建立 ${b.menus.length} 個選單。` : `失敗（${res.status}）${b.detail || b.error || ''}`;
    } catch (e) { $('setupMsg').textContent = '失敗：' + e.message; }
    $('setupMenus').disabled = false;
  };
  const r = await call('review_list');
  if (r.status !== 200) return status('讀取失敗（' + r.status + '）');
  const { packs, items } = r.body;
  status(packs.length ? `待審 ${packs.length} 筆（最舊的在上面）` : '目前沒有待審的配方。');
  $('list').replaceChildren(...packs.map(p => card(p, items)));
}

// 把答案轉成看得懂的文字
function answerText(answers) {
  return questions.questions.map(q => {
    const v = answers[q.id];
    const vals = Array.isArray(v) ? v : [v];
    const labels = vals.map(x => q.options.find(o => o.value === x)?.label ?? String(x));
    return `${q.text} → ${labels.join('、')}`;
  });
}

function card(p, items) {
  const r = p.result;
  const c = el('div', 'card');
  c.append(el('h2', '', `#${p.id}　${new Date(p.created_at).toLocaleString('zh-TW')}　每天 ${r.tier} 種`));

  const sc = p.scanSummary;
  c.append(el('div', 'mut', sc ? `近 4 週心率：${sc.n} 次量測，中位數 ${sc.median}，最近一次 ${sc.lastBpm}（${new Date(sc.lastAt).toLocaleDateString('zh-TW')}）。僅供參考，不影響配方` : '近 4 週沒有心率量測'));
  for (const it of r.items) c.append(el('div', '', `${it.name}，每天 ${it.dailyCapsules} 顆`), el('div', 'mut', `${it.reason}（分數 ${it.score}）`));

  const t = el('table');
  for (const x of r.totals) {
    const tr = el('tr');
    tr.append(el('td', '', x.name), el('td', '', `${x.amount} ${x.unit || ''}${x.pct != null ? `（上限 ${x.pct}%）` : ''}`));
    t.append(tr);
  }
  const det = el('details');
  det.append(el('summary', '', '整包成分加總'), t);
  c.append(det);

  for (const w of [...r.warnings]) c.append(el('div', 'warn', w));
  if (r.skipped.length) c.append(el('div', 'mut', '跳過：' + r.skipped.map(s => `${s.name}（${s.why}）`).join('、')));

  const ans = el('details');
  ans.append(el('summary', '', '客人的回答'), ...answerText(p.intakes.answers).map(t => el('div', 'mut', t)));
  c.append(ans);

  // 手動調整品項：勾選後按「重新檢查」，由後端重算上限與能否出貨
  const pick = el('div', 'pick');
  for (const it of items.filter(i => i.enabled)) {
    const lb = el('label');
    const cb = el('input');
    cb.type = 'checkbox';
    cb.value = it.id;
    cb.checked = p.item_ids.includes(it.id);
    lb.append(cb, it.name);
    pick.append(lb);
  }
  const chosen = () => [...pick.querySelectorAll('input:checked')].map(i => i.value);
  const msg = el('div', 'warn');
  const note = el('textarea');
  note.rows = 2;
  note.placeholder = '備註（退回原因或給自己的紀錄）';
  const chk = el('button', 'go ghost', '重新檢查這組品項');
  const ok = el('button', 'go', '核准');
  const back = el('button', 'go ghost', '退回');
  const row = el('div', 'row');
  row.append(back, ok);
  c.append(el('div', 'mut', '品項（可手動調整）'), pick, chk, msg, note, row);

  const check = async () => {
    const res = await call('review_check', { itemIds: chosen() });
    if (res.status !== 200) { msg.textContent = '檢查失敗（' + res.status + '）'; return; }
    const lines = [...res.body.errors, ...res.body.blockers];
    msg.textContent = lines.length ? lines.join('\n') : '檢查通過，可以核准。';
    msg.style.whiteSpace = 'pre-line';
    ok.disabled = res.body.blockers.length > 0;
  };
  chk.onclick = check;
  pick.onchange = () => { ok.disabled = true; msg.textContent = '品項已變更，請按「重新檢查」。'; };

  const decide = async decision => {
    ok.disabled = back.disabled = true;
    const res = await call('review_decide', { packId: p.id, decision, itemIds: chosen(), note: note.value });
    if (res.status === 200) return refresh();
    msg.textContent = res.body?.blockers ? res.body.blockers.join('\n') : '送出失敗（' + res.status + '）';
    back.disabled = false;
  };
  ok.onclick = () => decide('approve');
  back.onclick = () => decide('return');
  check();
  return c;
}
</script>
</body>
</html>
