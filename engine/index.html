<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deerly 問卷預覽</title>
<link rel="stylesheet" href="./style.css?v=202610240614">
</head>
<body>
<p class="mut">問卷預覽（內部測試用，不儲存資料，配方是暫定數字）</p>
<div id="chat"></div>
<div id="out"></div>

<script type="module">
// 版本檢查：LINE 會快取舊網頁，發現有新版就帶版本號重新載入一次
const V = '202610240614';
{
  const u = new URL(location.href);
  try {
    const { v } = await fetch(`./engine/version.json`, { cache: 'no-store' }).then(r => r.json());
    if (v !== V && u.searchParams.get('_v') !== v) { u.searchParams.set('_v', v); location.replace(u); await new Promise(() => {}); }
  } catch { /* 讀不到版本檔就用目前的版本 */ }
}
const { buildPack, validateData } = await import(`./engine.js?v=${V}`);
const { el, runSurvey } = await import(`./survey.js?v=${V}`);

const load = f => fetch(`./data/${f}.json?v=${V}`).then(r => r.json());
const [items, limits, questions, claims] = await Promise.all(['items', 'limits', 'questions', 'claims'].map(load));
const data = { items, limits, questions, claims };
const $ = id => document.getElementById(id);

const errs = validateData(data);
if (errs.length) { $('out').append(el('pre', 'warn', '資料檔有問題：\n' + errs.join('\n'))); throw new Error('data'); }

const answers = await runSurvey($('chat'), questions, claims.rejectMessages, {
  intro: '嗨，歡迎來到 Deerly。接下來用幾個簡單的問題了解你的日常，大約兩分鐘。',
  submitLabel: '看引擎結果',
});
$('chat').replaceChildren();
show(buildPack(answers, data));

function show(r) {
  const out = $('out');
  if (r.status !== 'needs_review') {
    out.append(el('div', 'card mut', `引擎結果：${r.status}（${(r.rejects || r.errors || []).join('、')}）`));
    return;
  }
  const c = el('div', 'card');
  c.append(el('b', '', `以下只有審核者看得到：待審配方（每天 ${r.tier} 種）`));
  for (const it of r.items) {
    const p = el('div');
    p.append(el('div', '', `${it.name}，每天 ${it.dailyCapsules} 顆`), el('div', 'mut', `${it.reason}（分數 ${it.score}${it.status === 'confirmed' ? '' : '，暫定'}）`));
    c.append(p);
  }
  const t = el('table');
  for (const x of r.totals) {
    const tr = el('tr');
    tr.append(el('td', '', x.name), el('td', '', `${x.amount} ${x.unit || ''}${x.pct != null ? `（上限 ${x.pct}%）` : ''}`));
    t.append(tr);
  }
  c.append(el('div', 'mut', '整包成分加總'), t);
  for (const w of [...r.blockers, ...r.warnings]) c.append(el('div', 'warn', w));
  if (r.skipped.length) c.append(el('div', 'mut', '跳過：' + r.skipped.map(s => `${s.name}（${s.why}）`).join('、')));
  c.append(el('div', 'mut', `${r.engineVersion}，${r.dataVersion.items}`));
  out.append(c);
}
</script>
</body>
</html>
