<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deerly 問卷預覽</title>
<style>
  :root{--bg:#faf8f5;--fg:#222;--mut:#777;--ac:#2f7d5b;--card:#fff;--me:#dff1e7;--warn:#a15c00}
  @media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--ac:#5cc79a;--card:#222;--me:#1f3a2c;--warn:#f0a948}}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Noto Sans TC",sans-serif;max-width:480px;margin:auto}
  h1{font-size:20px;margin:8px 0}
  .mut{color:var(--mut);font-size:14px}
  .bot,.me{padding:10px 12px;border-radius:14px;margin:8px 0;max-width:85%}
  .bot{background:var(--card)}
  .me{background:var(--me);margin-left:auto;text-align:right}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .opts button{padding:10px 14px;font-size:15px;border:1px solid var(--ac);border-radius:20px;background:none;color:var(--ac)}
  .opts button.on{background:var(--ac);color:#fff}
  button.go{width:100%;padding:12px;margin-top:4px;font-size:16px;border:0;border-radius:10px;background:var(--ac);color:#fff}
  button.go:disabled{opacity:.4}
  .card{background:var(--card);border-radius:10px;padding:12px;margin-top:10px}
  .warn{color:var(--warn);font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:3px 0}
  td:last-child{text-align:right}
</style>
</head>
<body>
<h1>Deerly 問卷預覽</h1>
<p class="mut">內部測試用。不會儲存任何資料，配方是暫定數字，結果只給 Herbert 審核看。</p>
<div id="chat"></div>
<div id="out"></div>

<script type="module">
import { buildPack, validateData } from './engine.js';

const load = f => fetch(`./data/${f}.json`, { cache: 'no-store' }).then(r => r.json());
const [items, limits, questions, claims] = await Promise.all(['items', 'limits', 'questions', 'claims'].map(load));
const data = { items, limits, questions, claims };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const errs = validateData(data);
if (errs.length) { $('out').append(el('pre', 'warn', '資料檔有問題：\n' + errs.join('\n'))); throw new Error('data'); }

const answers = {};
const say = (cls, text) => { const b = el('div', cls, text); $('chat').append(b); b.scrollIntoView({ behavior: 'smooth', block: 'end' }); };

say('bot', '嗨，我是下班鹿。接下來問你幾個關於作息和飲食的問題，大約三分鐘。');

for (const q of questions.questions) {
  say('bot', q.text);
  const picked = await ask(q);
  answers[q.id] = q.type === 'multi' ? picked : picked[0];
  say('me', picked.map(v => q.options.find(o => o.value === v).label).join('、'));
  // 拒收題一答到就停，不再往下問
  const rej = picked.map(v => q.options.find(o => o.value === v)).find(o => o.reject);
  if (rej) { say('bot', claims.rejectMessages[rej.reject]); break; }
}
show(buildPack(answers, data));

function ask(q) {
  return new Promise(done => {
    const box = el('div', 'opts');
    const sel = new Set();
    const go = el('button', 'go', '確定');
    for (const o of q.options) {
      const b = el('button', '', o.label);
      b.onclick = () => {
        if (q.type === 'single') { box.remove(); go.remove(); return done([o.value]); }
        if (sel.has(o.value)) sel.delete(o.value);
        else {
          // 「都沒有」和其他選項互斥
          if (o.exclusive) sel.clear();
          else for (const x of q.options) if (x.exclusive) sel.delete(x.value);
          if (q.max && sel.size >= q.max) return;
          sel.add(o.value);
        }
        [...box.children].forEach((c, i) => c.classList.toggle('on', sel.has(q.options[i].value)));
        go.disabled = !sel.size;
      };
      box.append(b);
    }
    $('chat').append(box);
    if (q.type === 'multi') {
      go.disabled = true;
      go.onclick = () => { box.remove(); go.remove(); done([...sel]); };
      $('chat').append(go);
    }
    box.scrollIntoView({ behavior: 'smooth', block: 'end' });
  });
}

function show(r) {
  const out = $('out');
  if (r.status !== 'needs_review') {
    out.append(el('div', 'card mut', `引擎結果：${r.status}（${(r.rejects || r.errors || []).join('、')}）`));
    return;
  }
  say('bot', '謝謝你！我們會依你的回答整理一包，確認後在 LINE 通知你。');
  const c = el('div', 'card');
  c.append(el('b', '', `以下只有審核者看得到：待審配方（每天 ${r.tier} 種）`));
  for (const it of r.items) {
    const p = el('div');
    p.append(el('div', '', `${it.name}，每天 ${it.dailyCapsules} 顆`), el('div', 'mut', `${it.reason}（分數 ${it.score}${it.status === 'confirmed' ? '' : '，暫定'}）`));
    c.append(p);
  }
  const t = el('table');
  for (const x of r.totals) {
    const tr = el('tr');
    tr.append(el('td', '', x.name), el('td', '', `${x.amount} ${x.unit || ''}${x.pct != null ? `（上限 ${x.pct}%）` : ''}`));
    t.append(tr);
  }
  c.append(el('div', 'mut', '整包成分加總'), t);
  for (const w of [...r.blockers, ...r.warnings]) c.append(el('div', 'warn', w));
  if (r.skipped.length) c.append(el('div', 'mut', '跳過：' + r.skipped.map(s => `${s.name}（${s.why}）`).join('、')));
  c.append(el('div', 'mut', `${r.engineVersion}，${r.dataVersion.items}`));
  out.append(c);
}
</script>
</body>
</html>
